name: CI

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [main, test]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Upgrade packaging tools (security baseline)
        run: |
          python -m pip install --upgrade "pip>=25.3" "setuptools>=78.1.1" "wheel>=0.41"

      - name: Install project (dev deps)
        run: |
          python -m pip install -e ".[dev,pandera]"

      - name: Run checks
        run: |
          python scripts/check.py