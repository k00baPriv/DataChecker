[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datachecker"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "pydantic>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "pip-audit>=2.7",
  "bandit>=1.7",
  "types-PyYAML",
]

notebooks = [
  "ipykernel>=6.0",
  "pandas>=2.0",
  "pandas-stubs",
  "Faker",
]

pandera = [
  "pandera>=0.18",
  "pandas>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=datachecker --cov-report=term-missing --cov-report=xml --cov-report=html"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 15
show_missing = true
skip_empty = true